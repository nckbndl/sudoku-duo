<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sudoku Duo">
<link rel="apple-touch-icon" href="icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sudoku Duo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe6; --panel:#fffdf8; --ink:#23212b; --muted:#6f6a78; --line:#2b2934; --thin:#d8d1c3;
  --given:#23212b; --user:#2d58cf; --note:#6d6879; --accent:#d9603a; --accent-ink:#fff;
  --hl:#efe8db; --same:#fbdcbc; --sel:#ffd27a; --err:#d2393a; --err-bg:#fcdedb;
  --pat:#cfe0ff; --tgt:#ffd3c9; --colA:#bfe3c6; --colB:#cfd6ff; --ok:#2f8f5b;
  --shadow:0 10px 30px rgba(40,30,20,.12); --r:14px; --nmark:var(--accent); --nmark-ink:#fff; --ns:1; --nts:1; --bfont:"Figtree",system-ui,sans-serif;
}
:root[data-mode=dark]{
  --bg:#15141a; --panel:#1f1e26; --ink:#efebe4; --muted:#a29dab; --line:#e6e1d8; --thin:#3b3945;
  --given:#f3efe8; --user:#8fb1ff; --note:#a7a2b0; --accent:#f07a52; --accent-ink:#1a1210;
  --hl:#2a2832; --same:#5a3d26; --sel:#7a5a14; --err:#ff7a70; --err-bg:#4a2422;
  --pat:#24385e; --tgt:#5a2a22; --colA:#1f4a2c; --colB:#2b3170; --ok:#5fd18f;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
@media (prefers-color-scheme:dark){:root:not([data-mode=light]){
  --bg:#15141a; --panel:#1f1e26; --ink:#efebe4; --muted:#a29dab; --line:#e6e1d8; --thin:#3b3945;
  --given:#f3efe8; --user:#8fb1ff; --note:#a7a2b0; --accent:#f07a52; --accent-ink:#1a1210;
  --hl:#2a2832; --same:#5a3d26; --sel:#7a5a14; --err:#ff7a70; --err-bg:#4a2422;
  --pat:#24385e; --tgt:#5a2a22; --colA:#1f4a2c; --colB:#2b3170; --ok:#5fd18f;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{width:100%;max-width:560px;padding:10px 12px 18px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;gap:10px}
.brand{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:22px;letter-spacing:-.3px;flex:1;white-space:nowrap}
.brand b{color:var(--accent)}
.pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--panel);color:var(--muted);border:1px solid var(--thin);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--thin)}
.timer svg{width:14px;height:14px}
.menub{width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--thin);display:flex;align-items:center;justify-content:center;flex:none}
.menub svg{width:20px;height:20px;stroke:var(--ink)}
@media (max-width:400px){.brand{font-size:19px}.pill{max-width:110px}}
.banner{background:var(--panel);border:1px solid var(--thin);border-radius:var(--r);padding:9px 12px;font-size:14px;display:flex;gap:10px;align-items:center}
.banner .x{margin-left:auto;color:var(--muted);font-size:18px;padding:0 4px}
.peers{display:flex;flex-wrap:wrap;gap:6px}
.peer{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--thin);border-radius:99px;padding:4px 10px 4px 6px;font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.bar{width:60px;height:6px;border-radius:9px;background:var(--hl);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.boardwrap{position:relative;align-self:center;width:min(100%, 72vh, 540px)}
.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;background:var(--panel);border:2.5px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);user-select:none;touch-action:manipulation}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--thin);border-bottom:1px solid var(--thin);font-family:var(--bfont);font-size:calc(clamp(18px,5.6vw,32px) * var(--ns));font-weight:500;color:var(--user);cursor:pointer;transition:background .12s}
.cell:nth-child(9n){border-right:0}
.cell:nth-child(9n+3),.cell:nth-child(9n+6){border-right:2px solid var(--line)}
.cell.r2,.cell.r5{border-bottom:2px solid var(--line)}
.cell.r8{border-bottom:0}
.cell.given{color:var(--given);font-weight:700}
.cell.hl{background:var(--hl)}
.cell.same{background:var(--same)}
.cell.sel{background:var(--sel)}
.cell.err{color:var(--err)}
.cell.err.given{color:var(--given)}
.cell.errbg{background:var(--err-bg)}
.cell.pat{background:var(--pat)}
.cell.tgt{background:var(--tgt)}
.cell.cA{background:var(--colA)}
.cell.cB{background:var(--colB)}
.cell .ring{position:absolute;inset:1px;border:2.5px solid var(--pc);border-radius:4px;pointer-events:none}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.notes span{display:flex;align-items:center;justify-content:center;font-size:calc(clamp(8px,2.3vw,13px) * var(--nts));color:var(--note);font-weight:600;line-height:1;border-radius:3px}
.notes span.nm{background:var(--nmark);color:var(--nmark-ink)}
.notes span.ne{color:var(--err);text-decoration:line-through;font-weight:800}
.notes span.np{color:var(--ok);font-weight:800}
.cover{position:absolute;inset:0;border-radius:10px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;z-index:3}
.cover h2{font-family:"Fraunces",serif;margin:0;font-size:26px}
.cover p{margin:0;color:var(--muted);max-width:320px}
.count{font-family:"Fraunces",serif;font-size:72px;font-weight:700;color:var(--accent)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:12px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tool svg{width:24px;height:24px;stroke:var(--ink)}
.tool:active{background:var(--hl)}
.tool.on{color:var(--accent)}
.tool.on svg{stroke:var(--accent)}
.tool .badge{position:absolute;top:2px;right:calc(50% - 26px);font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:1px 6px}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.num{aspect-ratio:.8;border-radius:12px;background:var(--panel);border:1px solid var(--thin);font-size:clamp(22px,6.4vw,30px);font-weight:600;color:var(--user);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 0 var(--thin)}
.num small{font-size:10px;color:var(--muted);font-weight:600;margin-top:3px}
.num:active{transform:translateY(1px);box-shadow:none}
.num.full{opacity:.28}
.notesmode .num{color:var(--note);font-size:clamp(15px,4.6vw,20px)}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.navb{background:var(--panel);border:1px solid var(--thin);border-radius:12px;padding:10px 4px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.navb svg{width:20px;height:20px;stroke:var(--accent)}
.hint{background:var(--panel);border:1px solid var(--thin);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.hint h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.hint h3 .lv{font-size:11px;color:var(--muted);font-weight:600;margin-left:auto}
.hint p{margin:6px 0;font-size:14.5px;line-height:1.45}
.hint .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px;background:var(--hl);border:1px solid var(--thin)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%;padding:13px}
.btn:disabled{opacity:.5}
.legend{font-size:12px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,8,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .15s}
@media (min-width:640px){.overlay{align-items:center}}
.sheet{background:var(--panel);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px 24px;box-shadow:var(--shadow);animation:up .2s}
@media (min-width:640px){.sheet{border-radius:20px}}
.sheet h2{font-family:"Fraunces",serif;margin:0 0 4px;font-size:24px}
.sheet h4{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sheet p{color:var(--muted);margin:4px 0 10px;font-size:14px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--thin);text-align:left}
.choice b{font-size:15px}
.choice span{font-size:12px;color:var(--muted)}
.choice.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.stack{display:flex;flex-direction:column;gap:8px}
input[type=text],textarea,select{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--thin);background:var(--bg);color:var(--ink)}
textarea{font-family:ui-monospace,monospace;font-size:12px;height:70px;resize:none;word-break:break-all}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--thin);font-size:15px}
.setrow select{width:auto}
.switch{width:46px;height:28px;border-radius:99px;background:var(--thin);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.switch.on{background:var(--accent)}
.switch.on::after{left:21px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--thin);text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.big{font-family:"Fraunces",serif;font-size:44px;font-weight:700;text-align:center;margin:6px 0}
.center{text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;box-shadow:var(--shadow);animation:up .2s;max-width:90vw;text-align:center}
.spin{width:38px;height:38px;border:4px solid var(--thin);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite}
.entrybar{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px dashed var(--accent);border-radius:var(--r);padding:10px 12px;font-size:14px}
.entrybar span{flex:1;font-size:13px;line-height:1.3}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(20px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes pop{50%{transform:scale(1.12)}}
.win .cell{animation:pop .5s ease both}
.hidden{display:none!important}

.num{font-family:var(--bfont)}
.num.act{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.num.gone{visibility:hidden}
.pad.grid3{grid-template-columns:repeat(3,1fr);gap:8px}
.pad.grid3 .num{aspect-ratio:auto;padding:10px 0;font-size:24px}
.timer.notime #time{display:none}
.seg{display:flex;background:var(--bg);border:1px solid var(--thin);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.setrow .seg{flex:0 0 auto;min-width:150px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.theme{border:1px solid var(--thin);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--bg)}
.theme.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.theme .sw{display:flex;gap:3px}
.theme .sw i{width:12px;height:12px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.12)}
.colrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--thin);font-size:15px}
.colrow span{flex:1}
.colrow input[type=color]{width:44px;height:32px;border:1px solid var(--thin);border-radius:8px;padding:2px;background:var(--bg)}
.colrow .rs{font-size:12px;color:var(--accent);font-weight:700;padding:4px}
.pv{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:300px;margin:6px auto 4px;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.pv .cell{aspect-ratio:1;font-size:calc(24px * var(--ns));border-right:1px solid var(--thin)!important;border-bottom:0!important}
.pv .cell:last-child{border-right:0!important}
.pv .notes span{font-size:calc(9px * var(--nts))}
.sheet .sticky{position:sticky;top:-18px;background:var(--panel);z-index:2;padding:6px 0 4px;margin-top:-6px}

</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Sudoku <b>Duo</b></div>
    <div class="pill" id="pill"></div>
    <button class="timer" id="timerBtn" aria-label="Pause">
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <svg id="playIcon" class="hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>
      <span id="time">0:00</span>
    </button>
    <button class="menub" id="bMenu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <div class="banner hidden" id="banner"></div>
  <div class="peers hidden" id="peers"></div>
  <div class="entrybar hidden" id="entrybar">
    <span data-t="enterT"></span>
    <button class="btn" id="ePaste">⌨︎</button>
    <button class="btn" id="eCancel" data-t="cancel"></button>
    <button class="btn pri" id="eStart" data-t="start"></button>
  </div>
  <div class="boardwrap">
    <div class="board" id="board"></div>
    <div class="cover hidden" id="cover"></div>
  </div>
  <div class="hint hidden" id="hint"></div>
  <div class="tools" id="tools">
    <button class="tool" id="tUndo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span data-t="undo"></span></button>
    <button class="tool" id="tErase"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg><span data-t="erase"></span></button>
    <button class="tool" id="tNotes"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span data-t="notes"></span></button>
    <button class="tool" id="tHint"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg><span data-t="hint"></span><span class="badge hidden" id="hintBadge"></span></button>
  </div>
  <div class="pad" id="pad"></div>
</div>
<script id="engine">
var SE = (function () {
  "use strict";
  var ROW = [], COL = [], BOX = [], UNITS = [], PEERS = [], SEES = [];
  for (var u = 0; u < 27; u++) UNITS.push([]);
  for (var i = 0; i < 81; i++) {
    var r = (i / 9) | 0, c = i % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0);
    ROW[i] = r; COL[i] = c; BOX[i] = b;
    UNITS[r].push(i); UNITS[9 + c].push(i); UNITS[18 + b].push(i);
  }
  for (i = 0; i < 81; i++) {
    var s = {};
    [ROW[i], 9 + COL[i], 18 + BOX[i]].forEach(function (uu) {
      UNITS[uu].forEach(function (j) { if (j !== i) s[j] = 1; });
    });
    PEERS[i] = Object.keys(s).map(Number);
    SEES[i] = new Uint8Array(81);
    PEERS[i].forEach(function (j) { SEES[i][j] = 1; });
  }
  var PC = new Uint8Array(512), DIGS = [];
  for (var m = 0; m < 512; m++) {
    var l = [];
    for (var d = 1; d <= 9; d++) if (m & (1 << (d - 1))) l.push(d);
    PC[m] = l.length; DIGS.push(l);
  }
  function bit(d) { return 1 << (d - 1); }

  // ---------- seeded RNG ----------
  function hashStr(str) {
    var h = 1779033703 ^ str.length;
    for (var k = 0; k < str.length; k++) {
      h = Math.imul(h ^ str.charCodeAt(k), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }
  function makeRng(seed) {
    var a = hashStr(String(seed))();
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(a, rand) {
    for (var k = a.length - 1; k > 0; k--) {
      var j = Math.floor(rand() * (k + 1)), t = a[k]; a[k] = a[j]; a[j] = t;
    }
    return a;
  }

  // ---------- brute-force solver (counts solutions) ----------
  function solve(grid, limit, rand) {
    var g = grid.slice(), rm = new Int32Array(9), cm = new Int32Array(9), bm = new Int32Array(9);
    for (var k = 0; k < 81; k++) if (g[k]) {
      var bb = bit(g[k]);
      if ((rm[ROW[k]] | cm[COL[k]] | bm[BOX[k]]) & bb) return { count: 0 };
      rm[ROW[k]] |= bb; cm[COL[k]] |= bb; bm[BOX[k]] |= bb;
    }
    var count = 0, sol = null;
    function rec() {
      var best = -1, bestM = 0, bestN = 10;
      for (var k = 0; k < 81; k++) if (!g[k]) {
        var mm = 511 & ~(rm[ROW[k]] | cm[COL[k]] | bm[BOX[k]]), n = PC[mm];
        if (n === 0) return false;
        if (n < bestN) { bestN = n; best = k; bestM = mm; if (n === 1) break; }
      }
      if (best < 0) { count++; if (!sol) sol = g.slice(); return count >= limit; }
      var ds = DIGS[bestM]; if (rand) ds = shuffle(ds.slice(), rand);
      for (var q = 0; q < ds.length; q++) {
        var dd = ds[q], b2 = bit(dd), r = ROW[best], c = COL[best], x = BOX[best];
        g[best] = dd; rm[r] |= b2; cm[c] |= b2; bm[x] |= b2;
        if (rec()) return true;
        g[best] = 0; rm[r] &= ~b2; cm[c] &= ~b2; bm[x] &= ~b2;
      }
      return false;
    }
    rec();
    return { count: count, solution: sol };
  }

  // ---------- logical solver ----------
  function newState(values) {

    tb.appendChild(el("tr", null, [el("td", { text: (r.ms ? ["🥇", "🥈", "🥉"][i] || "" : "") + " " + (r.me ? t("you") : nameOf(r.by)) }),
      el("td", { class: "n", text: "💡" + r.h }),
      el("td", { class: "n", text: r.ms ? fmt(r.ms) : (r.total ? Math.round(100 * r.filled / r.total) + "%" : "…") })]));
  });
  return tb;
}
function renderPeers() {
  var box = $("#peers"); box.innerHTML = "";
  if (!LIVE) { box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  box.appendChild(el("div", { class: "peer" }, [el("span", { class: "dot", style: "background:" + peerColor(LIVE.myPeer || "me") }), (LIVE.mode === "coop" ? t("liveCoop") : t("liveRace")) + " · " + t("you")]));
  var others = livePeers();
  if (!others.length) box.appendChild(el("div", { class: "peer" }, [el("span", { class: "spin", style: "width:12px;height:12px;border-width:2px" }), t("waiting")]));
  others.forEach(function (p) {
    var pr = p.presence, kids = [el("span", { class: "dot", style: "background:" + peerColor(p.peer) }), nameOf(p.by || pr.uid)];
    if (LIVE.mode === "race") {
      if (pr.phase !== "lobby" && pr.hints) kids.push(el("span", { class: "legend", text: "💡" + pr.hints }));
      if (pr.doneMs) kids.push(" ✓ " + fmt(pr.doneMs));
      else if (pr.phase === "lobby") kids.push(pr.ready ? " ✓" : " …");
      else { var b = el("span", { class: "bar" }, [el("i", { style: "width:" + Math.round(100 * (pr.filled || 0) / (pr.total || 1)) + "%" })]); kids.push(b); }
    } else if (typeof pr.sel === "number" && pr.sel >= 0) kids.push(el("span", { class: "legend", text: t("editing") + " " + HINTS.cn(pr.sel, L()) }));
    box.appendChild(el("div", { class: "peer" }, kids));
  });
  box.appendChild(el("button", { class: "peer", text: "＋ " + t("inviteT"), onclick: function () { showInvite(LIVE.mode); } }));
  box.appendChild(el("button", { class: "peer", text: "✕ " + t("leave"), onclick: leaveLive }));
}

function pushName() { if (USER && USER.setName && S.name) USER.setName(S.name).catch(function () {}); }
whenCaps(pushName);
function askName(then) {
  modal(function (sh) {

// leaderboard
function saveTime(coop) {
  if (!DB || !MYID || !G) return;
  var ref; try { ref = DB.collection("times").doc(MYID); } catch (e) { return; }
  var entry = { ms: Math.round(G.el), h: G.hints, m: G.mist, c: coop ? 1 : 0, lv: G.diff, at: Date.now() }, pid = G.pid;
  ref.get().then(function (s) {
    var d = s.exists ? JSON.parse(JSON.stringify(s.data())) : {};
    d.r = d.r || {};
    var prev = d.r[pid];
    if (prev && prev.ms <= entry.ms) return;
    d.r[pid] = entry;
    return ref.set(d).then(function () { toast(t("saved")); });
  }).catch(function () {});
}
function showLeaderboard() {
  if (!G) return;
  modal(function (sh) {
    sh.appendChild(el("h2", { text: t("board") }));
    sh.appendChild(el("p", { text: (G.label ? G.label + " · " : "") + diffName(G.diff) }));
    var body = el("div", { text: t("loading") }); sh.appendChild(body);
    var rows = [];
    if (G.chal) rows.push({ name: G.chal.name || "🎯", ms: G.chal.ms, h: G.chal.h });
    var draw = function (note) {
      body.innerHTML = "";
      if (note) body.appendChild(el("p", { text: note }));
      if (!rows.length) { body.appendChild(el("p", { text: t("leaderEmpty") })); return; }
      rows.sort(function (a, b) { return a.ms - b.ms; });
      var tb = el("table");
      tb.appendChild(el("tr", null, [el("th", { text: "#" }), el("th"), el("th", { text: t("hintsUsed"), class: "n" }), el("th", { text: t("time"), class: "n" })]));
      rows.forEach(function (r, i) {
        tb.appendChild(el("tr", null, [el("td", { text: ["🥇", "🥈", "🥉"][i] || String(i + 1) }),
          el("td", { text: (r.id ? (r.id === MYID ? t("you") : nameOf(r.id)) : r.name) + (r.c ? " (" + t("coopShort") + ")" : "") }),
          el("td", { class: "n", text: r.h == null ? "–" : String(r.h) }), el("td", { class: "n", text: fmt(r.ms) })]));
      });
      body.appendChild(tb);
    };
    whenCaps(function () {
      if (!DB) { draw(t("dbOff")); return; }
      var done = false, timer = setTimeout(function () { if (!done) { done = true; draw(t("dbOff")); } }, 10000);
      DB.collection("times").get().then(function (snap) {
        snap.docs.forEach(function (d) {
          var x = d.data(), r = x && x.r && x.r[G.pid];
          if (r && typeof r.ms === "number") rows.push({ id: d.id, ms: r.ms, h: r.h, c: r.c });
        });
        return resolveNames(rows.map(function (r) { return r.id; }).filter(Boolean));
      }).then(function () { if (!done) { done = true; clearTimeout(timer); draw(); } }, function () { if (!done) { done = true; clearTimeout(timer); draw(t("dbOff")); } });
    });
  });
}
